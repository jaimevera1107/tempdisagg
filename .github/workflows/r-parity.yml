name: r-parity

# Generates reference results with the R package tempdisagg and requires the
# Python implementation to match them (missing references fail the job).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install the R package
        run: Rscript -e 'install.packages("tempdisagg", repos = "https://cloud.r-project.org")'
      - name: Generate R references
        run: Rscript tests/reference/generate_r_reference.R
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Parity tests
        env:
          TEMPDISAGG_REQUIRE_R_REFERENCE: "1"
        run: pytest tests/test_r_parity.py -v
      - name: Keep the references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-reference
          path: tests/reference/*.csv
