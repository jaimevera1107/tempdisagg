[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tempdisagg"
version = "0.6.2"
description = "Temporal disaggregation of time series: Chow-Lin, Fernandez, Litterman, Denton and more"
readme = "README.md"
authors = [{ name = "Jaime Vera-Jaramillo", email = "jaimevera1107@gmail.com" }]
license = { text = "MIT" }
keywords = ["temporal disaggregation", "benchmarking", "chow-lin", "denton", "time series", "econometrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/jaimevera1107/tempdisagg"
Issues = "https://github.com/jaimevera1107/tempdisagg/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tempdisagg", "tempdisagg.*"]

[tool.setuptools.package-data]
tempdisagg = ["py.typed", "datasets/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:tests.test_legacy"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
